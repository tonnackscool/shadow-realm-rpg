<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Realm - Text RPG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0d10; color: #c9d1d9;
    font-family: 'Courier New', monospace;
    max-width: 700px; margin: 20px auto;
    padding: 0 15px;
    line-height: 1.5;
  }
  h1 {
    color: #e3b341; text-align: center;
    letter-spacing: 2px; border-bottom: 2px solid #e3b341;
    padding-bottom: 10px; margin-bottom: 15px;
    font-size: 1.8rem;
  }
  .panel {
    background: #161b22; border: 1px solid #30363d;
    padding: 12px; margin-bottom: 12px;
    border-radius: 6px;
  }
  .section-title {
    color: #7d8590; font-size: 12px;
    text-transform: uppercase; letter-spacing: 1px;
    margin: 14px 0 6px;
  }
  #log {
    height: 220px; overflow-y: auto;
    white-space: pre-wrap; font-size: 14px;
    background: #161b22; border: 1px solid #30363d;
    padding: 12px; border-radius: 6px;
    margin-bottom: 12px;
  }
  .log-entry {
    opacity: 0; transform: translateY(4px);
    animation: fadeIn 0.2s forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; transform: translateY(0); }
  }
  .ambush { color: #f85149; font-weight: bold; }
  #stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 6px;
    background: #161b22; border: 1px solid #30363d;
    padding: 12px; border-radius: 6px;
    margin-bottom: 12px;
  }
  .stat b { color: #58a6ff; }
  #bar-wrap {
    background: #21262d; border-radius: 4px;
    height: 14px; overflow: hidden;
    margin: 4px 0 8px;
  }
  #bar {
    background: #3fb950; height: 100%;
    width: 100%; transition: width 0.3s;
  }
  .btnrow {
    display: flex; flex-wrap: wrap;
    gap: 8px; margin-bottom: 12px;
  }
  button {
    background: #21262d; color: #c9d1d9;
    border: 1px solid #30363d;
    padding: 10px 14px; cursor: pointer;
    font-family: inherit; font-size: 0.9rem;
    border-radius: 4px; transition: all 0.2s;
    touch-action: manipulation;
  }
  button:hover:not(:disabled) {
    background: #30363d; border-color: #58a6ff;
    transform: scale(1.02);
  }
  button:disabled {
    opacity: 0.4; cursor: not-allowed;
  }
  .pulse { animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(88,166,255,0.4); }
    70% { box-shadow: 0 0 0 6px rgba(88,166,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(88,166,255,0); }
  }
  #rank {
    text-align: center; color: #e3b341;
    font-size: 13px; margin-bottom: 10px;
  }
  .timer {
    font-size: 11px; color: #7d8590;
    text-align: right; margin-top: -4px; margin-bottom: 8px;
  }
  .settings-toggle {
    cursor: pointer; font-size: 1.2rem;
    color: #e3b341; user-select: none;
    text-align: right; margin-bottom: 5px;
  }
  #settings-panel {
    display: none; margin-bottom: 12px;
  }
  .setting-row {
    display: flex; align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .setting-row label { margin-right: 10px; }
  .setting-row input[type="range"] { width: 150px; }
  @media (max-width: 500px) {
    h1 { font-size: 1.4rem; }
    button { padding: 10px 8px; font-size: 0.85rem; }
    .btnrow { justify-content: center; }
    .setting-row input[type="range"] { width: 100px; }
  }
</style>
</head>
<body>
<h1>Shadow Realm</h1>

<!-- Auth -->
<div id="login-screen" class="panel">
  <div class="section-title" style="margin-top:0;">Log in or register</div>
  <input id="login-username" placeholder="Display name" maxlength="20" style="width:100%;padding:10px;margin-bottom:8px;background:#0b0d10;border:1px solid #30363d;color:#c9d1d9;border-radius:4px;">
  <input id="login-email" type="email" placeholder="Email" style="width:100%;padding:10px;margin-bottom:8px;background:#0b0d10;border:1px solid #30363d;color:#c9d1d9;border-radius:4px;">
  <input id="login-password" type="password" placeholder="Password" style="width:100%;padding:10px;margin-bottom:8px;background:#0b0d10;border:1px solid #30363d;color:#c9d1d9;border-radius:4px;">
  <div class="btnrow">
    <button onclick="registerAccount()">Register</button>
    <button onclick="loginAccount()">Log in</button>
  </div>
  <div id="login-msg" style="font-size:12px;color:#f85149;"></div>
</div>

<!-- Hero select -->
<div id="hero-select" class="panel" style="display:none;">
  <div class="section-title" style="margin-top:0;">Choose your hero</div>
  <div id="hero-list" style="display:flex;flex-direction:column;gap:8px;"></div>
</div>

<!-- Game UI -->
<div id="game-ui" style="display:none;">
  <!-- Top bar: Music, Settings, Cooldown -->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
    <button onclick="toggleMusic()" id="musicBtn">Toggle Music</button>
    <span id="cooldown-display" style="color:#e3b341; font-weight:bold;"></span>
    <span class="settings-toggle" onclick="toggleSettings()">⚙️ Settings</span>
  </div>

  <!-- Settings panel -->
  <div id="settings-panel" class="panel">
    <div class="section-title" style="margin-top:0;">Settings</div>
    <div class="setting-row">
      <label>Change username:</label>
      <input id="settings-username" type="text" maxlength="20" style="width:150px;background:#0b0d10;border:1px solid #30363d;color:#c9d1d9;padding:4px;">
      <button onclick="changeUsername()">Update</button>
    </div>
    <div class="setting-row">
      <label>Music volume:</label>
      <input id="music-volume" type="range" min="0" max="100" value="10" oninput="updateMusicVolume(this.value)">
    </div>
    <div class="setting-row">
      <label>SFX volume:</label>
      <input id="sfx-volume" type="range" min="0" max="100" value="10" oninput="updateSfxVolume(this.value)">
    </div>
    <div class="setting-row">
      <label>AI Ambushes:</label>
      <select id="ambush-toggle" onchange="toggleAmbush(this.value)">
        <option value="on">On</option>
        <option value="off">Off</option>
      </select>
    </div>
  </div>

  <!-- Wallet -->
  <div class="panel">
    <div id="wallet-status">Wallet not connected</div>
    <div class="btnrow">
      <button id="connectBtn" onclick="connectWallet()">Connect Phantom Wallet</button>
      <button id="redeemBtn" onclick="redeemGold()" disabled>Redeem Gold for TRI</button>
      <button id="disconnectBtn" onclick="disconnectWallet()" style="display:none;">Disconnect Wallet</button>
    </div>
    <div style="color:#7d8590;font-size:12px;">Rate: 100 gold = 1 TRI</div>
  </div>

  <div id="rank"></div>
  <div id="stats"></div>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div class="timer" id="stamina-timer">Next regen: --s</div>

  <!-- Training -->
  <div class="section-title">Train (uses stamina)</div>
  <div class="btnrow" id="train-btns">
    <button onclick="train('str')" class="action-btn">Train Strength (-5 STA)</button>
    <button onclick="train('def')" class="action-btn">Train Defense (-5 STA)</button>
    <button onclick="train('hp')" class="action-btn">Train Vitality (-8 STA)</button>
  </div>

  <!-- Actions -->
  <div class="section-title">Actions</div>
  <div class="btnrow" id="action-btns">
    <button onclick="fightMonster()" class="action-btn">Hunt Monster (-10 STA)</button>
    <button onclick="rest()" class="action-btn">Rest (-20 gold)</button>
    <button onclick="resetGame()" class="action-btn">Reset Character</button>
    <button onclick="logoutAccount()">Log out</button>
  </div>

  <!-- Daily Quest -->
  <div class="section-title">Daily Quest</div>
  <div id="quest-box" class="panel"></div>

  <!-- Boss Fight -->
  <div class="section-title">Boss Fight</div>
  <div class="btnrow">
    <button onclick="fightBoss()" class="action-btn">Challenge Today's Boss (-30 STA)</button>
  </div>

  <!-- Shop -->
  <div class="section-title">Shop</div>
  <div id="shop-box" class="panel"></div>

  <!-- Equipment / Inventory -->
  <div class="section-title">Equipment & Inventory</div>
  <div id="inventory-box" class="panel"></div>

  <!-- PvP Arena -->
  <div class="section-title">PvP Arena</div>
  <div class="btnrow">
    <button onclick="refreshArena()">Refresh Opponents</button>
    <button onclick="autoAttack()" class="action-btn">Auto Attack (10 fights)</button>
  </div>
  <div id="arena-list" class="panel"></div>

  <!-- Leaderboard -->
  <div class="section-title">Top Players</div>
  <div class="btnrow">
    <button onclick="refreshLeaderboard()">Refresh Leaderboard</button>
  </div>
  <div id="leaderboard-list" class="panel"></div>

  <!-- Battle Log -->
  <div class="section-title">Battle Log</div>
  <div class="btnrow">
    <button onclick="refreshBattleLog()">Refresh Battle Log</button>
  </div>
  <div id="battlelog-list" class="panel"></div>

  <!-- Daily Tournament -->
  <div class="section-title">Daily Tournament</div>
  <div class="btnrow">
    <button onclick="refreshTournament()">Refresh Standings</button>
    <button onclick="claimTournament()" class="action-btn">Claim Champion Reward</button>
  </div>
  <div id="tournament-list" class="panel"></div>

  <!-- Log -->
  <div id="log"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ---------- Firebase Init ----------
const firebaseConfig = {
  apiKey: "AIzaSyBv5Bk6ONZuzScCFbaGeN3AlYDLzhHPh5U",
  authDomain: "shadow-realm-9cd37.firebaseapp.com",
  projectId: "shadow-realm-9cd37",
  storageBucket: "shadow-realm-9cd37.firebasestorage.app",
  messagingSenderId: "11627585581",
  appId: "1:11627585581:web:00dad9397ccbf2ec9e58a4"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
</script>

<script>
// ========== GAME STATE & HEROES ==========
const HEROES = [
  { id:'warrior', name:'Warrior', tagline:'Brute strength', str:8, def:5, maxhp:35, staGain:1, desc:'High STR.' },
  { id:'guardian', name:'Guardian', tagline:'Defense-first', str:4, def:10, maxhp:40, staGain:1, desc:'High DEF/HP.' },
  { id:'rogue', name:'Rogue', tagline:'Balanced', str:6, def:6, maxhp:28, staGain:2, desc:'Fast stamina regen.' },
  { id:'berserker', name:'Berserker', tagline:'Glass cannon', str:11, def:2, maxhp:22, staGain:1, desc:'Huge risk/reward.' },
  { id:'scholar', name:'Scholar', tagline:'Scales best', str:4, def:4, maxhp:26, staGain:1, xpBonus:1.25, desc:'+25% XP, weak start.' }
];

let state = null;
let currentUser = null;
let pendingUsername = null;
let walletPubkey = null;
let arenaRecords = [];
let lastPublishTime = 0;
const PUBLISH_THROTTLE_MS = 30000;

// Cooldown
let actionCooldownRemaining = 0;
let cooldownInterval = null;

// Background music
let musicOsc = null;
let musicGain = null;
let musicPlaying = false;
let musicVolume = 0.1; // 10%

// SFX global gain
let sfxGain = null;
let sfxVolume = 0.1;

// Ambush setting
let ambushesEnabled = true;

// Settings
function toggleSettings() {
  const panel = document.getElementById('settings-panel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (panel.style.display === 'block' && state) {
    document.getElementById('settings-username').value = state.username;
  }
}

function updateMusicVolume(val) {
  musicVolume = val / 100;
  if (musicGain) musicGain.gain.value = musicVolume;
  localStorage.setItem('musicVolume', val);
}

function updateSfxVolume(val) {
  sfxVolume = val / 100;
  if (sfxGain) sfxGain.gain.value = sfxVolume;
  localStorage.setItem('sfxVolume', val);
}

function toggleAmbush(val) {
  ambushesEnabled = val === 'on';
  localStorage.setItem('ambushesEnabled', val);
}

function changeUsername() {
  const newName = document.getElementById('settings-username').value.trim();
  if (!newName) return;
  state.username = newName;
  print(`Username changed to ${newName}.`);
  render();
}

const EQUIP_SLOTS = ['weapon', 'armor', 'accessory'];

// ========== SOUND ENGINE (Web Audio) ==========
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioCtx();
    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = sfxVolume;
    sfxGain.connect(audioCtx.destination);
  }
}
function playTone(freq, type='square', duration=0.1, vol=0.1) {
  if (!audioCtx || !sfxGain) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain).connect(sfxGain);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function sfxTrain() { playTone(400, 'triangle', 0.15, 0.08); }
function sfxRest() { playTone(300, 'sine', 0.3, 0.1); }
function sfxBuy() { playTone(600, 'square', 0.1, 0.12); }
function sfxHit() { playTone(200, 'sawtooth', 0.05, 0.1); }
function sfxVictory() { playTone(800, 'square', 0.2, 0.1); setTimeout(()=>playTone(1200,'square',0.2,0.1), 150); }
function sfxDefeat() { playTone(100, 'sawtooth', 0.3, 0.12); }
function sfxLevelUp() { playTone(1000, 'triangle', 0.3, 0.15); playTone(1500, 'triangle', 0.3, 0.15); }
function sfxAmbush() { playTone(80, 'sawtooth', 0.2, 0.15); }

// ========== BACKGROUND MUSIC ==========
function startBackgroundMusic() {
  if (musicPlaying) return;
  initAudio();
  musicOsc = audioCtx.createOscillator();
  musicGain = audioCtx.createGain();
  musicOsc.type = 'sine';
  musicOsc.frequency.value = 60;
  musicGain.gain.value = musicVolume;
  musicOsc.connect(musicGain).connect(audioCtx.destination);
  musicOsc.loop = true;
  musicOsc.start();
  musicPlaying = true;
}
function stopBackgroundMusic() {
  if (musicOsc) {
    musicOsc.stop();
    musicOsc.disconnect();
    musicOsc = null;
    musicGain = null;
    musicPlaying = false;
  }
}
function toggleMusic() {
  if (musicPlaying) {
    stopBackgroundMusic();
    document.getElementById('musicBtn').textContent = 'Play Music';
  } else {
    startBackgroundMusic();
    document.getElementById('musicBtn').textContent = 'Mute Music';
  }
}

// ========== COOLDOWN ==========
function startCooldown(seconds) {
  actionCooldownRemaining = seconds;
  updateCooldownDisplay();
  setActionButtonsDisabled(true);
  if (cooldownInterval) clearInterval(cooldownInterval);
  cooldownInterval = setInterval(() => {
    actionCooldownRemaining--;
    updateCooldownDisplay();
    if (actionCooldownRemaining <= 0) {
      clearInterval(cooldownInterval);
      cooldownInterval = null;
      setActionButtonsDisabled(false);
      document.getElementById('cooldown-display').textContent = '';
    }
  }, 1000);
}
function updateCooldownDisplay() {
  const display = document.getElementById('cooldown-display');
  if (actionCooldownRemaining > 0) {
    const mins = Math.floor(actionCooldownRemaining / 60);
    const secs = actionCooldownRemaining % 60;
    display.textContent = `Cooldown: ${mins}m ${secs.toString().padStart(2,'0')}s`;
  } else {
    display.textContent = '';
  }
}
function setActionButtonsDisabled(disabled) {
  document.querySelectorAll('.action-btn').forEach(btn => {
    btn.disabled = disabled;
  });
}

// ========== AUTH ==========
function registerAccount() {
  const username = document.getElementById('login-username').value.trim();
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass = document.getElementById('login-password').value;
  const msg = document.getElementById('login-msg');
  if (!username) { msg.textContent = 'Choose a display name.'; return; }
  if (!email || !pass) { msg.textContent = 'Enter email and password.'; return; }
  if (pass.length < 6) { msg.textContent = 'Password too short.'; return; }
  pendingUsername = username;
  msg.textContent = 'Creating account...';
  auth.createUserWithEmailAndPassword(email, pass).catch(e => msg.textContent = e.message);
}
function loginAccount() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const pass = document.getElementById('login-password').value;
  const msg = document.getElementById('login-msg');
  if (!email || !pass) { msg.textContent = 'Enter email and password.'; return; }
  msg.textContent = 'Logging in...';
  auth.signInWithEmailAndPassword(email, pass).catch(e => msg.textContent = e.message);
}
function logoutAccount() { auth.signOut(); }

auth.onAuthStateChanged(async user => {
  if (user) {
    currentUser = user;
    document.getElementById('login-screen').style.display = 'none';
    const hadSave = await load();
    if (hadSave) {
      render();
      tryAutoConnect();
      loadSettings();
      if (musicVolume > 0) startBackgroundMusic();
    } else {
      document.getElementById('hero-select').style.display = 'block';
      renderHeroSelect();
    }
  } else {
    currentUser = null;
    state = null;
    log.textContent = '';
    document.getElementById('game-ui').style.display = 'none';
    document.getElementById('hero-select').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
  }
});

// ========== HERO SELECT ==========
function renderHeroSelect() {
  document.getElementById('hero-list').innerHTML = HEROES.map(h => `
    <div style="border:1px solid #30363d;border-radius:6px;padding:10px;">
      <b style="color:#e3b341;">${h.name}</b> <span style="color:#7d8590;">— ${h.tagline}</span>
      <div style="font-size:12px;">STR ${h.str} | DEF ${h.def} | HP ${h.maxhp}${h.xpBonus?' | +25% XP':''}${h.staGain>1?' | Fast regen':''}</div>
      <div style="font-size:12px;margin:4px 0;">${h.desc}</div>
      <button onclick="selectHero('${h.id}')">Play as ${h.name}</button>
    </div>
  `).join('');
}

function selectHero(id) {
  const h = HEROES.find(x=>x.id===id);
  state = {
    hero: h.id, name: h.name,
    username: pendingUsername || (currentUser?.email?.split('@')[0] || 'Adventurer'),
    level:1, xp:0, xpNext:20,
    str:h.str, def:h.def, maxhp:h.maxhp, hp:h.maxhp,
    gold:0, stamina:100, maxStamina:100,
    staGain:h.staGain, xpBonus:h.xpBonus||1,
    kills:0,
    ownedItems:[], equipped:{weapon:null,armor:null,accessory:null},
    questDate:null, questProgress:0, questClaimed:false,
    lastBossDate:null,
    tournamentDate:null, tournamentWins:0, tournamentClaimed:false
  };
  pendingUsername = null;
  document.getElementById('hero-select').style.display = 'none';
  document.getElementById('game-ui').style.display = 'block';
  log.textContent = "";
  print(`You begin your journey as a ${h.name}.`);
  render();
  tryAutoConnect();
  loadSettings();
  if (musicVolume > 0) startBackgroundMusic();
}

// ========== HELPERS ==========
const log = document.getElementById('log');
function print(msg, cls='') {
  const div = document.createElement('div');
  div.className = 'log-entry' + (cls ? ' '+cls : '');
  div.textContent = msg;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function useStamina(cost) {
  if (state.stamina < cost) { print(`Not enough stamina.`); return false; }
  state.stamina -= cost;
  return true;
}
function getEquippedStats() {
  let bonus = {str:0, def:0, maxhp:0};
  if (!state) return bonus;
  for (let slot of EQUIP_SLOTS) {
    const itemId = state.equipped[slot];
    if (itemId) {
      const item = findShopItem(itemId);
      if (item) {
        if (item.str) bonus.str += item.str;
        if (item.def) bonus.def += item.def;
        if (item.maxhp) bonus.maxhp += item.maxhp;
      }
    }
  }
  return bonus;
}
function getOpponentDisplay(opp) {
  return opp.heroDisplay || opp.username || opp.name || 'Unknown';
}

// ========== RENDER & SAVE ==========
function render() {
  if (!state) return;
  const eq = getEquippedStats();
  const totalStr = state.str + eq.str;
  const totalDef = state.def + eq.def;
  const totalMaxHp = state.maxhp + eq.maxhp;
  document.getElementById('rank').textContent =
    `${state.username} the ${state.name} | Lvl ${state.level} | Kills: ${state.kills} | Gold: ${state.gold}`;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>STR:</b> ${totalStr} (base ${state.str} + ${eq.str})</div>
    <div class="stat"><b>DEF:</b> ${totalDef} (base ${state.def} + ${eq.def})</div>
    <div class="stat"><b>HP:</b> ${state.hp}/${totalMaxHp}</div>
    <div class="stat"><b>XP:</b> ${state.xp}/${state.xpNext}</div>
  `;
  const pct = Math.max(0, Math.round((state.stamina / state.maxStamina) * 100));
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('bar').style.background = pct < 25 ? '#f85149' : (pct < 60 ? '#e3b341' : '#3fb950');
  save();
  renderShop();
  renderInventory();
  renderQuest();
  const now = Date.now();
  if (now - lastPublishTime > PUBLISH_THROTTLE_MS) {
    publishToArena();
    lastPublishTime = now;
  }
}

let saveTimer = null;
function save() {
  if (!state || !currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    db.collection('saves').doc(currentUser.uid).set(state).catch(e => print('Save failed.'));
  }, 800);
}
async function load() {
  if (!currentUser) return false;
  try {
    const doc = await db.collection('saves').doc(currentUser.uid).get();
    if (doc.exists) {
      state = doc.data();
      if (!state.ownedItems) state.ownedItems = [];
      if (!state.equipped) state.equipped = {weapon:null,armor:null,accessory:null};
      if (state.questDate === undefined) state.questDate = null;
      if (state.questProgress === undefined) state.questProgress = 0;
      if (state.questClaimed === undefined) state.questClaimed = false;
      if (state.lastBossDate === undefined) state.lastBossDate = null;
      if (state.tournamentDate === undefined) state.tournamentDate = null;
      if (state.tournamentWins === undefined) state.tournamentWins = 0;
      if (state.tournamentClaimed === undefined) state.tournamentClaimed = false;
      document.getElementById('hero-select').style.display = 'none';
      document.getElementById('game-ui').style.display = 'block';
      print("Welcome back.");
      return true;
    }
  } catch(e) { print('Cloud load error.'); }
  return false;
}
function loadSettings() {
  const musicVal = localStorage.getItem('musicVolume');
  if (musicVal) {
    document.getElementById('music-volume').value = musicVal;

// ========== WALLET ==========
function getPhantomProvider() {
  if (window.phantom?.solana?.isPhantom) return window.phantom.solana;
  if (window.solana?.isPhantom) return window.solana;
  return null;
}
async function connectWallet() {
  const provider = getPhantomProvider();
  if (!provider) { alert("Phantom not found."); return; }
  try {
    const resp = await provider.connect();
    walletPubkey = resp.publicKey.toString();
    updateWalletUI();
  } catch(e) { print("Wallet connection failed."); }
}
async function disconnectWallet() {
  const provider = getPhantomProvider();
  try { if (provider?.disconnect) await provider.disconnect(); } catch(e){}
  walletPubkey = null;
  localStorage.removeItem('shadowrealm_wallet');
  updateWalletUI();
}
function updateWalletUI() {
  if (walletPubkey) {
    document.getElementById('wallet-status').textContent = `Connected: ${walletPubkey.slice(0,4)}...${walletPubkey.slice(-4)}`;
    document.getElementById('connectBtn').disabled = true;
    document.getElementById('redeemBtn').disabled = false;
    document.getElementById('disconnectBtn').style.display = 'inline-block';
  } else {
    document.getElementById('wallet-status').textContent = 'Wallet not connected';
    document.getElementById('connectBtn').disabled = false;
    document.getElementById('redeemBtn').disabled = true;
    document.getElementById('disconnectBtn').style.display = 'none';
  }
}
async function tryAutoConnect() {
  const provider = getPhantomProvider();
  if (provider) {
    try {
      const resp = await provider.connect({ onlyIfTrusted: true });
      walletPubkey = resp.publicKey.toString();
      updateWalletUI();
    } catch(e){}
  }
}

async function redeemGold() {
  if (!walletPubkey || !currentUser) return;
  const TRI_RATE = 100;
  if (state.gold < TRI_RATE) { print(`Need ${TRI_RATE} gold.`); return; }
  const amount = Math.floor(state.gold / TRI_RATE);
  state.gold -= amount * TRI_RATE;
  try {
    await db.collection('tri_redemptions').add({
      uid: currentUser.uid, wallet: walletPubkey,
      triAmount: amount, goldSpent: amount*TRI_RATE,
      timestamp: new Date().toISOString(), status:"pending"
    });
    print(`Redeemed ${amount*TRI_RATE} gold for ${amount} TRI.`);
  } catch(e) {
    state.gold += amount*TRI_RATE;
    print("Redemption failed.");
  }
  render();
}

// ========== TRAINING & REST (with cooldown) ==========
function train(type) {
  if (actionCooldownRemaining > 0) { print("Cooldown active. Wait."); return; }
  initAudio();
  const cost = type==='hp'?8:5;
  if (!useStamina(cost)) return;
  if (type==='str') { state.str+=1; print(`Strength +1 → ${state.str}.`); sfxTrain(); }
  else if (type==='def') { state.def+=1; print(`Defense +1 → ${state.def}.`); sfxTrain(); }
  else if (type==='hp') { state.maxhp+=3; state.hp=Math.min(state.hp+3, state.maxhp+getEquippedStats().maxhp); print(`Max HP +3.`); sfxTrain(); }
  startCooldown(60);
  render();
}
function rest() {
  if (actionCooldownRemaining > 0) { print("Cooldown active."); return; }
  if (state.gold < 20) { print(`Need 20 gold.`); return; }
  state.gold -= 20;
  state.stamina = Math.min(state.maxStamina, state.stamina + 15);
  state.hp = Math.min(state.maxhp + getEquippedStats().maxhp, state.hp + 5);
  print(`You rest.`); sfxRest();
  startCooldown(60);
  render();
}

// ========== LOOT SYSTEM ==========
function rollLoot() {
  const roll = Math.random();
  if (roll < 0.03) {
    const stat = ['str','def','maxhp'][Math.floor(Math.random()*3)];
    if (stat==='str') { state.str += 1; print(`Loot: Mystic Scroll! +1 STR.`); }
    else if (stat==='def') { state.def += 1; print(`Loot: Mystic Scroll! +1 DEF.`); }
    else { state.maxhp += 3; print(`Loot: Mystic Scroll! +3 Max HP.`); }
  } else if (roll < 0.08) {
    state.gold += 80;
    print(`Loot: Enchanted Gem! +80 gold.`);
  } else if (roll < 0.12) {
    state.hp = Math.min(state.maxhp+getEquippedStats().maxhp, state.hp+15);
    print(`Loot: Health Potion. +15 HP.`);
  } else if (roll < 0.16) {
    state.stamina = Math.min(state.maxStamina, state.stamina+20);
    print(`Loot: Stamina Potion. +20 STA.`);
  } else if (roll < 0.19) {
    const frag = FEATURED_ITEMS[Math.floor(Math.random()*FEATURED_ITEMS.length)];
    if (!state.ownedItems.includes(frag.id)) {
      state.ownedItems.push(frag.id);
      print(`Loot: ${frag.name}! Check inventory.`);
    }
  }
}

  { id:'potion_hp', name:'Health Potion', desc:'+25 HP', price:30, type:'consumable' },
  { id:'potion_sta', name:'Stamina Potion', desc:'+30 STA', price:25, type:'consumable' },
  { id:'iron_sword', name:'Iron Sword', desc:'+3 STR', price:150, type:'equipment', slot:'weapon', str:3 },
  { id:'steel_shield', name:'Steel Shield', desc:'+3 DEF', price:150, type:'equipment', slot:'armor', def:3 },
  { id:'vigor_ring', name:'Ring of Vigor', desc:'+15 Max HP', price:200, type:'equipment', slot:'accessory', maxhp:15 }
];
const FEATURED_ITEMS = [
  { id:'dragon_fang', name:'Dragon Fang', desc:'+8 STR', price:900, type:'equipment', slot:'weapon', str:8 },
  { id:'titan_plate', name:'Titan Plate', desc:'+8 DEF', price:900, type:'equipment', slot:'armor', def:8 },
  { id:'phoenix_heart', name:'Phoenix Heart', desc:'+40 Max HP', price:1000, type:'equipment', slot:'accessory', maxhp:40 },
  { id:'warlord_crown', name:'Warlord Crown', desc:'+5 STR, +5 DEF', price:1300, type:'equipment', slot:'accessory', str:5, def:5 },
  { id:'elixir_ages', name:'Elixir of Ages', desc:'+20 HP, +2 STR, +2 DEF', price:1100, type:'equipment', slot:'accessory', maxhp:20, str:2, def:2 }
];

function findShopItem(id) {
  return SHOP_ITEMS.concat(FEATURED_ITEMS).find(i=>i.id===id);
}
function getFeaturedItem() {
  const d = new Date();
  const seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  return FEATURED_ITEMS[seed % FEATURED_ITEMS.length];
}
function renderShop() {
  const box = document.getElementById('shop-box');
  if (!box || !state) return;
  const featured = getFeaturedItem();
  const owned = state.ownedItems.includes(featured.id);
  const equipped = Object.values(state.equipped).includes(featured.id);
  const featuredHtml = `
    <div style="border:1px solid #e3b341;border-radius:6px;padding:10px;margin-bottom:10px;background:#1c1608;">
      <div style="color:#e3b341;">★ Featured: ${featured.name}</div>
      <div>${featured.desc} (${featured.price}g)</div>
      <button ${owned?'disabled':''} onclick="buyItem('${featured.id}')">${equipped?'Equipped':owned?'Owned':'Buy'}</button>
    </div>`;
  const regularHtml = SHOP_ITEMS.map(item => {
    const owned = state.ownedItems.includes(item.id);
    const equipped = Object.values(state.equipped).includes(item.id);
    return `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #21262d;">
      <span><b>${item.name}</b> ${item.desc} (${item.price}g)</span>
      <button ${owned?'disabled':''} onclick="buyItem('${item.id}')">${equipped?'Equipped':owned?'Owned':'Buy'}</button>
    </div>`;
  }).join('');
  box.innerHTML = featuredHtml + regularHtml;
}

function renderInventory() {
  const box = document.getElementById('inventory-box');
  if (!box || !state) return;
  const items = state.ownedItems.map(id => findShopItem(id)).filter(Boolean);
  if (items.length === 0) {
    box.innerHTML = '<div style="color:#7d8590;">No items owned.</div>';
    return;
  }
  box.innerHTML = items.map(item => {
    const slot = item.slot || 'consumable';
    const equipped = Object.entries(state.equipped).find(([s,id])=>id===item.id);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #21262d;">
      <span><b>${item.name}</b> (${slot}) ${equipped ? '[Equipped]' : ''}</span>
      <div>
        ${item.slot ? `<button onclick="equipItem('${item.id}')">${equipped?'Unequip':'Equip'}</button>` : ''}
      </div>
    </div>`;
  }).join('');
}

function equipItem(itemId) {
  const item = findShopItem(itemId);
  if (!item || !item.slot) return;
  const slot = item.slot;
  if (state.equipped[slot] === itemId) {
    state.equipped[slot] = null;
    print(`Unequipped ${item.name}.`);
  } else {
    state.equipped[slot] = itemId;
    print(`Equipped ${item.name}.`);
  }
  render();
}

function buyItem(itemId) {
  initAudio();
  const item = findShopItem(itemId);
  if (!item) return;
  if (item.type==='equipment' && state.ownedItems.includes(itemId)) {
    print("Already owned."); return;
  }
  if (state.gold < item.price) { print("Not enough gold."); return; }
  state.gold -= item.price;
  if (item.type==='consumable') {
    if (item.id==='potion_hp') state.hp = Math.min(state.maxhp+getEquippedStats().maxhp, state.hp+25);
    else if (item.id==='potion_sta') state.stamina = Math.min(state.maxStamina, state.stamina+30);
    print(`Used ${item.name}.`);
  } else {
    state.ownedItems.push(itemId);
    if (item.slot && !state.equipped[item.slot]) {
      state.equipped[item.slot] = itemId;
    }
    print(`Purchased ${item.name}.`);
  }
  sfxBuy();
  render();
}

// ========== FIGHT SYSTEM (with cooldown) ==========
function fightMonster() {
  if (actionCooldownRemaining > 0) { print("Cooldown active."); return; }
  if (!useStamina(10)) return;
  initAudio();
  const monsters = [
    {name:"Goblin", hp:15, atk:3, xp:8, gold:5},
    {name:"Wild Boar", hp:20, atk:4, xp:10, gold:7},
    {name:"Skeleton", hp:25, atk:5, xp:14, gold:10},
    {name:"Bandit", hp:30, atk:6, xp:18, gold:14},
    {name:"Orc Brute", hp:40, atk:8, xp:26, gold:20}
  ];
  const tier = Math.min(monsters.length-1, Math.floor(state.level/2));
  const m = {...monsters[tier]};
  print(`A ${m.name} attacks!`);
  const eq = getEquippedStats();
  let myHp = state.hp, oppHp = m.hp;
  while (oppHp>0 && myHp>0) {
    const dmg = Math.max(1, (state.str+eq.str)*2 - Math.floor(Math.random()*3));
    oppHp -= dmg;
    print(`You hit for ${dmg}.`); sfxHit();
    if (oppHp<=0) break;
    const mdmg = Math.max(1, m.atk - Math.floor((state.def+eq.def)/2));
    myHp -= mdmg;
    print(`${m.name} hits for ${mdmg}.`);
  }
  if (myHp<=0) {
    state.hp = 1; print("You retreat."); sfxDefeat();
  } else {
    state.hp = myHp;
    state.kills++;
    state.xp += Math.round(m.xp*(state.xpBonus||1));
    state.gold += m.gold;
    if (state.questDate===todayKey()) state.questProgress++;
    print(`Victory! +${m.xp} XP, +${m.gold} gold.`); sfxVictory();
    rollLoot();
    checkLevelUp();
  }
  startCooldown(60);
  render();
}

function fightBoss() {
  if (actionCooldownRemaining > 0) { print("Cooldown active."); return; }
  if (!state) return;
  const today = todayKey();
  if (state.lastBossDate===today) { print("Boss already defeated today."); return; }
  if (state.stamina<30) { print("Need 30 stamina."); return; }
  state.stamina-=30; state.lastBossDate=today;
  initAudio();
  const boss = {
    name: `${['Ancient','Corrupted','Molten','Frozen','Shadow'][state.level%5]} Warlord`,
    hp:60+state.level*15, atk:8+state.level*2
  };
  print(`Challenging ${boss.name}!`);
  const eq = getEquippedStats();
  let myHp = state.hp, bossHp = boss.hp;
  while (bossHp>0 && myHp>0) {
    const dmg = Math.max(1, (state.str+eq.str)*2 - Math.floor(Math.random()*3));
    bossHp -= dmg; sfxHit();
    if (bossHp<=0) break;
    const bdmg = Math.max(1, boss.atk - Math.floor((state.def+eq.def)/2));
    myHp -= bdmg;
  }
  if (myHp<=0) {
    state.hp = Math.max(1, Math.floor((state.maxhp+eq.maxhp)*0.2));
    print("You were crushed."); sfxDefeat();
  } else {
    const goldWon = 80+state.level*10;
    const xpWon = Math.round((40+state.level*5)*(state.xpBonus||1));
    state.gold += goldWon; state.xp += xpWon; state.kills++;
    print(`Boss down! +${goldWon}g, +${xpWon} XP.`); sfxVictory();
    rollLoot(); rollLoot();
    checkLevelUp();
  }
  startCooldown(60);
  render();
}

function checkLevelUp() {
  while (state.xp >= state.xpNext) {
    state.level++;
    state.xp -= state.xpNext;
    state.xpNext = Math.floor(state.xpNext*1.4);
    state.maxhp += 5; state.hp = state.maxhp + getEquippedStats().maxhp;
    state.str += 1; state.def += 1;
    print(`*** LEVEL UP! Lvl ${state.level} ***`);
    sfxLevelUp();
  }
}

// ========== PVP & ARENA (no level display, fallback names) ==========
function generateBots(playerLevel) {
  const levels = [
    Math.max(1, playerLevel + Math.floor(Math.random()*3)-1),
    Math.max(1, playerLevel + Math.floor(Math.random()*3)-1),
    playerLevel + 8 + Math.floor(Math.random()*5)
  ];
  return levels.map((lvl,i) => {
    const hero = HEROES[Math.floor(Math.random()*HEROES.length)];
    let str = 4 + lvl*2 + Math.floor(Math.random()*3);
    let def = 4 + lvl*2 + Math.floor(Math.random()*3);
    let maxhp = 25 + lvl*6;
    if (lvl >= 25) { str += 10; def += 10; maxhp += 40; }
    else if (lvl >= 15) { str += 5; def += 5; maxhp += 20; }
    return {
      id: 'bot_'+i+'_'+lvl,
      heroDisplay: hero.name,
      level: lvl, str, def, maxhp,
      isBot: true
    };
  });
}

async function refreshArena() {
  const listEl = document.getElementById('arena-list');
  listEl.innerHTML = 'Loading...';
  let records = [];
  try {
    const snap = await db.collection('pvp_public').get();
    snap.forEach(doc => {
      const r = doc.data();
      if (r.uid !== currentUser?.uid) records.push(r);
    });
  } catch(e){}
  const bots = generateBots(state?.level||1);
  records = records.concat(bots);
  records.sort((a,b) => b.level - a.level);
  arenaRecords = records.slice(0,20);
  listEl.innerHTML = arenaRecords.map((r,i) => `
    <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #21262d;">
      <span>${getOpponentDisplay(r)}</span>
      <button onclick="fightPlayer(${i})" class="action-btn">Challenge</button>
    </div>`).join('');
}

async function publishToArena() {
  if (!state || !currentUser) return;
  try {
    await db.collection('pvp_public').doc(currentUser.uid).set({
      uid: currentUser.uid,
      username: state.username,
      heroDisplay: state.name,
      level: state.level,
      str: state.str + getEquippedStats().str,
      def: state.def + getEquippedStats().def,
      maxhp: state.maxhp + getEquippedStats().maxhp,
      kills: state.kills,
      gold: state.gold,
      tournamentDate: state.tournamentDate,
      tournamentWins: state.tournamentWins,
      updated: new Date().toISOString()
    });
  } catch(e){}
}

function fightPlayer(index) {
  if (actionCooldownRemaining > 0) { print("Cooldown active."); return; }
  const opp = arenaRecords[index];
  if (!opp || !state) return;
  if (state.stamina < 15 || state.gold < 10) { print("Need 15 STA and 10 gold."); return; }
  state.stamina -= 15; state.gold -= 10;
  initAudio();
  const oppName = getOpponentDisplay(opp);
  print(`Duel vs ${oppName}!`);
  const eq = getEquippedStats();
  let myHp = state.hp, oppHp = opp.maxhp;
  while (myHp>0 && oppHp>0) {
    const myDmg = Math.max(1, (state.str+eq.str)*2 - Math.floor(opp.def/2) - Math.floor(Math.random()*3));
    oppHp -= myDmg; sfxHit();
    if (oppHp<=0) break;
    const oppDmg = Math.max(1, opp.str*2 - Math.floor((state.def+eq.def)/2) - Math.floor(Math.random()*3));
    myHp -= oppDmg;
  }
  if (myHp<=0) {
    state.hp = Math.max(1, Math.floor((state.maxhp+eq.maxhp)*0.2));
    state.gold -= Math.min(state.gold, 10+Math.floor(Math.random()*15));
    state.xp -= Math.min(state.xp, Math.floor(state.xp*0.15));
    print(`Defeated.`); sfxDefeat();
    logBattle(opp, 'loss');
  } else {
    state.hp = myHp;
    const goldWon = 15 + opp.level*3;
    const xpWon = Math.round((10+opp.level*2)*(state.xpBonus||1));
    state.gold += goldWon; state.xp += xpWon; state.kills++;
    print(`Victory! +${goldWon}g, +${xpWon} XP.`); sfxVictory();
    rollLoot();
    logBattle(opp, 'win');
    if (opp.uid && !opp.isBot) {
      const today = todayKey();
      if (state.tournamentDate !== today) { state.tournamentDate = today; state.tournamentWins = 0; state.tournamentClaimed = false; }
      state.tournamentWins++;
      updateTournamentLeader(state.tournamentWins);
    }
    checkLevelUp();
  }
  startCooldown(60);
  render();
}

async function updateTournamentLeader(wins) {
  if (!currentUser) return;
  const today = todayKey();
  const leaderRef = db.collection('tournamentLeader').doc(today);
  try {
    await db.runTransaction(async t => {
      const doc = await t.get(leaderRef);
      if (!doc.exists || wins > (doc.data().topWins || 0)) {
        t.set(leaderRef, {
          topUid: currentUser.uid,
          topWins: wins,
          claimed: false
        }, {merge: true});
      }
    });
  } catch(e){}
}

async function claimTournament() {
  if (!state || !currentUser) return;
  const today = todayKey();
  if (state.tournamentDate !== today || state.tournamentWins <= 0) { print("No wins today."); return; }
  if (state.tournamentClaimed) { print("Already claimed."); return; }
  const leaderRef = db.collection('tournamentLeader').doc(today);
  try {
    await db.runTransaction(async t => {
      const doc = await t.get(leaderRef);
      if (!doc.exists) throw new Error("No leader yet.");
      const data = doc.data();
      if (data.claimed) throw new Error("Already claimed by someone else.");
      if (data.topUid !== currentUser.uid) throw new Error("You are not the champion.");
      t.update(leaderRef, { claimed: true });
      state.tournamentClaimed = true;
      const goldWon = 150;
      const xpWon = Math.round(60*(state.xpBonus||1));
      state.gold += goldWon;
      state.xp += xpWon;
      print(`*** Tournament Champion! +${goldWon}g, +${xpWon} XP. ***`);
      sfxLevelUp();
      checkLevelUp();
      render();
    });
  } catch(e) {
    print(e.message);
  }
}

async function logBattle(opp, result, aiInitiated=false) {
  if (!currentUser) return;
  const oppName = getOpponentDisplay(opp);
  try {
    await db.collection('pvp_battles').add({
      attackerUid: aiInitiated ? null : currentUser.uid,
      attackerName: aiInitiated ? oppName : (state.username||state.name),
      defenderUid: aiInitiated ? currentUser.uid : (opp.uid||null),
      defenderName: aiInitiated ? (state.username||state.name) : oppName,
      isBot: !!opp.isBot,
      aiInitiated,
      result,
      participants: [currentUser.uid].concat(opp.uid||[]),
      timestamp: new Date().toISOString()
    });
  } catch(e){}
}

async function autoAttack() {
  if (actionCooldownRemaining > 0) { print("Cooldown active."); return; }
  if (arenaRecords.length===0) await refreshArena();
  print("--- Auto Attack (10 fights) ---");
  setActionButtonsDisabled(true);
  for (let i=0; i<10; i++) {
    if (!state || state.stamina<15) break;
    const idx = Math.floor(Math.random()*arenaRecords.length);
    fightPlayer(idx);
    await new Promise(r => setTimeout(r, 500));
  }
  print("Auto attack finished.");
  startCooldown(60);
}

// ========== AMBUSH (AI) ==========
function aiAmbush() {
  if (!ambushesEnabled) return;
  if (!state || state.hp<=0) return;
  const hero = HEROES[Math.floor(Math.random()*HEROES.length)];
  const lvl = Math.max(1, state.level + Math.floor(Math.random()*3)-1);
  let str = 4 + lvl*2; let def = 4 + lvl*2; let maxhp = 25 + lvl*6;
  if (lvl>=25){str+=10;def+=10;maxhp+=40;} else if(lvl>=15){str+=5;def+=5;maxhp+=20;}
  const bot = {heroDisplay:hero.name, level:lvl, str, def, maxhp, isBot:true};
  print(`--- Ambush! ${hero.name} attacks! ---`, 'ambush');
  sfxAmbush();
  const eq = getEquippedStats();
  let myHp = state.hp, oppHp = bot.maxhp;
  while (myHp>0 && oppHp>0) {
    const oppDmg = Math.max(1, bot.str*2 - Math.floor((state.def+eq.def)/2));
    myHp -= oppDmg; sfxHit();
    if (myHp<=0) break;
    const myDmg = Math.max(1, (state.str+eq.str)*2 - Math.floor(bot.def/2));
    oppHp -= myDmg;
  }
  if (myHp<=0) {
    state.hp = Math.max(1, Math.floor((state.maxhp+eq.maxhp)*0.25));
    state.gold -= Math.min(state.gold, 5+Math.floor(Math.random()*15));
    print("You were overwhelmed."); sfxDefeat();
    logBattle(bot, 'win', true);
  } else {
    state.hp = myHp;
    const goldWon = 10+lvl*2;
    const xpWon = Math.round((8+lvl)*(state.xpBonus||1));
    state.gold += goldWon; state.xp += xpWon;
    print(`Ambush repelled! +${goldWon}g, +${xpWon} XP.`); sfxVictory();
    logBattle(bot, 'loss', true);
    checkLevelUp();
  }
  render();
}

// ========== LEADERBOARD & BATTLE LOG ==========
async function refreshLeaderboard() {
  const list = document.getElementById('leaderboard-list');
  list.innerHTML = 'Loading...';
  try {
    const snap = await db.collection('pvp_public').get();
    const players = []; snap.forEach(d=>players.push(d.data()));
    players.sort((a,b)=>b.level-a.level||(b.kills||0)-(a.kills||0));
    list.innerHTML = players.slice(0,10).map((p,i)=>`
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #21262d;${p.uid===currentUser?.uid?'color:#e3b341':''}">
        <span>#${i+1} ${p.username || p.heroDisplay || 'Unknown'} ${p.uid===currentUser?.uid?'(you)':''}</span>
        <span>Lvl ${p.level} | ${p.kills||0} kills</span>
      </div>`).join('') || 'No players yet.';
  } catch(e) { list.innerHTML = 'Error.'; }
}
async function refreshBattleLog() {
  const list = document.getElementById('battlelog-list');
  if (!currentUser) return;
  try {
    const snap = await db.collection('pvp_battles').where('participants','array-contains',currentUser.uid).get();
    const battles = []; snap.forEach(d=>battles.push(d.data()));
    battles.sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));
    list.innerHTML = battles.slice(0,15).map(b=>{
      const youWon = (b.attackerUid===currentUser.uid && b.result==='win') || (b.defenderUid===currentUser.uid && b.result==='loss');
      const opp = b.aiInitiated ? b.attackerName : b.defenderName;
      return `<div style="display:flex;justify-content:space-between;">
        <span>${b.aiInitiated?`${opp} ambushed you`:`You vs ${opp}`}</span>
        <b style="color:${youWon?'#3fb950':'#f85149'};">${youWon?'WIN':'LOSS'}</b>
      </div>`;
    }).join('') || 'No battles yet.';
  } catch(e) { list.innerHTML = 'Error.'; }
}

// ========== STAMINA TIMER ==========
let regenTick = 6;
setInterval(() => {
  if (state && state.stamina < state.maxStamina) {
    regenTick--;
    document.getElementById('stamina-timer').textContent = `Next regen: ${regenTick}s`;
    if (regenTick <= 0) {
      state.stamina = Math.min(state.maxStamina, state.stamina + (state.staGain||1));
      regenTick = 6;
      render();
    }
  } else {
    document.getElementById('stamina-timer').textContent = 'Stamina full';
    regenTick = 6;
  }
}, 1000);

// Ambush interval (only if enabled)
setInterval(() => {
  if (state && state.hp>0 && ambushesEnabled && Math.random()<0.05) aiAmbush();
}, 6000);

// ========== RESET & MISC ==========
function resetGame() {
  if (!confirm("Reset?")) return;
  state = null;
  db.collection('saves').doc(currentUser.uid).delete();
  document.getElementById('game-ui').style.display='none';
  document.getElementById('hero-select').style.display='block';
  renderHeroSelect();
}

window.addEventListener('load', () => {
  initAudio();
  loadSettings();
  document.body.addEventListener('click', initAudio, {once:true});
});
</script>
